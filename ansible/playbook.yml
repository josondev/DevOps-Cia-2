---
- name: Deploy the Java CI/CD app to Kubernetes
  hosts: aks
  gather_facts: false
  vars:
    namespace: cicd-demo
  tasks:
    - name: Ensure target namespace exists
      ansible.builtin.command: kubectl apply -f {{ playbook_dir }}/../k8s/namespace.yaml
      register: namespace_apply
      changed_when: "'created' in namespace_apply.stdout or 'configured' in namespace_apply.stdout"

    - name: Apply Kubernetes manifests
      ansible.builtin.command: kubectl apply -k {{ playbook_dir }}/../k8s
      register: deploy_output
      changed_when: "'created' in deploy_output.stdout or 'configured' in deploy_output.stdout"

    - name: Show deployment summary
      ansible.builtin.debug:
        var: deploy_output.stdout_lines
